name: TestProject
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: GetCode
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'
      - name: Install Dependencies
        run: npm ci
      - name: Run Tests
        run: npm run build
